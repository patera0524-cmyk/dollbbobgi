<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>평택초등학교 학생자치회 폰프리스쿨 행사 랜덤 뽑기</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Tone.js for web audio sound effects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Round:wght@400;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Nanum Round', sans-serif;
            background: linear-gradient(135deg, #ffd3b6 0%, #ffaaa5 40%, #d4a5edd6 100%);
            min-height: 100vh;
            user-select: none;
            overflow-x: hidden;
        }

        .font-jua {
            font-family: 'Jua', sans-serif;
        }

        /* Title Glow Effect */
        .title-glow {
            text-shadow: 
                0 0 10px rgba(255, 255, 255, 0.8),
                0 4px 0px #b54a72,
                0 6px 15px rgba(0,0,0,0.25);
        }

        .subtitle-badge {
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
        }

        /* Claw Machine Container Frame */
        .arcade-frame {
            background: linear-gradient(180deg, #fff3f8 0%, #ffe0ec 100%);
            border: 12px solid #ff7b9c;
            box-shadow: 
                inset 0 0 25px rgba(255, 123, 156, 0.5),
                0 20px 40px rgba(0, 0, 0, 0.2),
                0 0 0 6px #ffd3e0;
        }

        /* Glass Reflection Effect */
        .glass-window {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0.05) 50%, rgba(255, 255, 255, 0.2) 100%);
            backdrop-filter: blur(1px);
        }

        /* Crane animations */
        .crane-cable {
            transition: height 1.2s ease-in-out;
        }

        .crane-head {
            transition: transform 0.3s ease;
        }

        .claw-arm-left {
            transform-origin: top right;
            transition: transform 0.4s ease;
        }
        .claw-arm-right {
            transform-origin: top left;
            transition: transform 0.4s ease;
        }

        .claw-grabbing .claw-arm-left {
            transform: rotate(22deg) !important;
        }
        .claw-grabbing .claw-arm-right {
            transform: rotate(-22deg) !important;
        }

        /* Plushie Floating Animation */
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(2deg); }
        }
        .float-plushie {
            animation: floatSlow 3s ease-in-out infinite;
        }

        /* Neon Sign Pulse */
        @keyframes neonPulse {
            0%, 100% { opacity: 1; filter: drop-shadow(0 0 8px #ff69b4); }
            50% { opacity: 0.85; filter: drop-shadow(0 0 3px #ff69b4); }
        }
        .neon-sign {
            animation: neonPulse 2s infinite;
        }

        /* Prize Modal Popup */
        @keyframes popIn {
            0% { transform: scale(0.4) rotate(-5deg); opacity: 0; }
            70% { transform: scale(1.08) rotate(2deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .animate-pop {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Button Press Effect */
        .btn-arcade {
            transition: all 0.1s ease;
            box-shadow: 0 8px 0 #c23860, 0 12px 20px rgba(0,0,0,0.3);
        }
        .btn-arcade:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #c23860, 0 4px 10px rgba(0,0,0,0.2);
        }
        .btn-arcade:disabled {
            background: #cbd5e1 !important;
            box-shadow: 0 6px 0 #94a3b8 !important;
            cursor: not-allowed;
            transform: none !important;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between min-h-screen p-3 md:p-6">

    <!-- TOP HEADER / BANNER -->
    <header class="text-center w-full max-w-2xl mt-2 mb-4">
        <!-- Subtitle Badge -->
        <div class="inline-flex items-center gap-2 bg-white/90 backdrop-blur-md px-5 py-2 rounded-full border-2 border-pink-400 mb-3 subtitle-badge animate-bounce">
            <span class="text-xl">🏫</span>
            <span class="font-bold text-pink-600 text-sm md:text-base tracking-wide">평택초등학교 학생자치회 주관</span>
            <span class="text-xl">✨</span>
        </div>

        <!-- Main Title -->
        <h1 class="font-jua text-4xl sm:text-5xl md:text-6xl text-white title-glow leading-tight tracking-wide">
            폰프리스쿨 행사 <br class="sm:hidden">
            <span class="text-yellow-300 drop-shadow-[0_4px_0_#d97706]">랜덤 뽑기</span> 🎁
        </h1>
        <p class="text-pink-900 font-bold text-sm sm:text-base mt-2 opacity-90">
            스마트폰을 잠시 내려놓고 즐거운 게임을! 인형뽑기로 행운의 선물을 뽑아보세요!
        </p>
    </header>

    <!-- MAIN ARCADE MACHINE -->
    <main class="relative w-full max-w-md md:max-w-lg aspect-[4/5] arcade-frame rounded-3xl overflow-hidden flex flex-col justify-between p-4 my-2">
        
        <!-- Arcade Marquee Header inside machine -->
        <div class="w-full bg-gradient-to-r from-pink-500 via-purple-500 to-pink-500 rounded-2xl py-2 px-4 flex items-center justify-between border-2 border-white shadow-inner mb-2 z-20">
            <div class="flex items-center gap-1">
                <span class="w-3 h-3 rounded-full bg-yellow-300 animate-ping"></span>
                <span class="w-3 h-3 rounded-full bg-green-300"></span>
                <span class="w-3 h-3 rounded-full bg-blue-300"></span>
            </div>
            <span class="font-jua text-white text-lg tracking-wider neon-sign">★ PHONE-FREE LUCKY CLAW ★</span>
            <!-- Sound Toggle Button -->
            <button id="soundToggle" class="bg-white/20 hover:bg-white/40 text-white rounded-lg p-1.5 text-xs font-bold transition flex items-center gap-1">
                <span id="soundIcon">🔊</span> <span id="soundText" class="hidden sm:inline">소리 ON</span>
            </button>
        </div>

        <!-- GLASS PLAY AREA -->
        <div id="playArea" class="relative flex-1 bg-gradient-to-b from-sky-100/60 via-purple-100/40 to-pink-100/80 rounded-2xl border-4 border-pink-200 overflow-hidden glass-window flex flex-col justify-between">
            
            <!-- Crane Track Top Rail -->
            <div class="w-full h-4 bg-slate-400 border-b-2 border-slate-600 relative shadow-md z-10">
                <div class="w-full h-1 bg-yellow-400 top-1 relative"></div>
                <!-- Moving Carriage -->
                <div id="craneCarriage" class="absolute top-0 left-1/2 -translate-x-1/2 w-16 h-5 bg-gray-800 rounded-b-md shadow-lg transition-all duration-700">
                    <!-- Crane Rope / Cable -->
                    <div id="craneCable" class="w-1 bg-slate-700 mx-auto crane-cable shadow-sm" style="height: 35px;"></div>
                    
                    <!-- Crane Claw Assembly -->
                    <div id="craneHead" class="absolute left-1/2 -translate-x-1/2 -bottom-9 w-12 h-10 flex flex-col items-center z-30 transition-transform">
                        <!-- Motor cap -->
                        <div class="w-8 h-4 bg-yellow-500 rounded-t-md border border-amber-700"></div>
                        <!-- Claw Arms Container -->
                        <div id="clawAssembly" class="relative w-10 h-6">
                            <!-- Left arm -->
                            <svg class="claw-arm-left absolute -left-1 top-0 w-6 h-8 text-slate-700" viewBox="0 0 24 36" fill="currentColor">
                                <path d="M18 0 L6 12 C2 18 2 26 8 34 L12 36 L10 30 C6 24 6 18 12 12 Z" />
                            </svg>
                            <!-- Right arm -->
                            <svg class="claw-arm-right absolute -right-1 top-0 w-6 h-8 text-slate-700" viewBox="0 0 24 36" fill="currentColor" style="transform: scaleX(-1);">
                                <path d="M18 0 L6 12 C2 18 2 26 8 34 L12 36 L10 30 C6 24 6 18 12 12 Z" />
                            </svg>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Floating Decorative Stars inside glass -->
            <div class="absolute inset-0 pointer-events-none opacity-40">
                <span class="absolute top-8 left-6 text-xl">✨</span>
                <span class="absolute top-16 right-8 text-lg">⭐</span>
                <span class="absolute top-28 left-1/4 text-sm">✨</span>
            </div>

            <!-- Caught Prize Container (Carried by Crane) -->
            <div id="grabbedItem" class="absolute left-1/2 -translate-x-1/2 pointer-events-none opacity-0 transition-opacity duration-300 z-20" style="top: 80px;">
                <!-- Dynamically filled on grab -->
            </div>

            <!-- BOTTOM PLUSHIES & CAPSULES PILE -->
            <div class="relative w-full h-44 mt-auto z-10 flex items-end justify-center px-2 pb-2">
                
                <!-- Chute/Drop Hole on the left -->
                <div class="absolute bottom-0 left-2 w-20 h-28 bg-slate-800/80 rounded-t-xl border-4 border-dashed border-yellow-300/80 flex flex-col items-center justify-center text-center p-1 overflow-hidden">
                    <span class="text-xs text-yellow-300 font-jua">선물 배출구</span>
                    <span class="text-2xl animate-pulse">⬇️</span>
                </div>

                <!-- Plushie & Capsule Heap Grid -->
                <div class="w-full pl-20 grid grid-cols-5 gap-1 items-end relative">
                    
                    <!-- Row 2 (Back) Plushies -->
                    <div class="text-3xl sm:text-4xl filter drop-shadow-md transform -translate-y-4 translate-x-1 float-plushie" style="animation-delay: 0.2s;" title="곰돌이">🧸</div>
                    <div class="text-3xl sm:text-4xl filter drop-shadow-md transform -translate-y-6 float-plushie" style="animation-delay: 0.7s;" title="토끼">🐰</div>
                    <div class="text-3xl sm:text-4xl filter drop-shadow-md transform -translate-y-5 -translate-x-1 float-plushie" style="animation-delay: 1.1s;" title="병아리">🐥</div>
                    <div class="text-3xl sm:text-4xl filter drop-shadow-md transform -translate-y-6 float-plushie" style="animation-delay: 0.4s;" title="고양이">🐱</div>
                    <div class="text-3xl sm:text-4xl filter drop-shadow-md transform -translate-y-3 float-plushie" style="animation-delay: 0.9s;" title="판다">🐼</div>

                    <!-- Row 1 (Front) Capsules & Plushies -->
                    <div class="text-4xl sm:text-5xl filter drop-shadow-lg transform translate-y-1 hover:scale-110 transition cursor-pointer" title="캡슐">🔴</div>
                    <div class="text-4xl sm:text-5xl filter drop-shadow-lg transform -translate-y-1 hover:scale-110 transition cursor-pointer" title="곰돌이">🧸</div>
                    <div class="text-4xl sm:text-5xl filter drop-shadow-lg transform translate-y-2 hover:scale-110 transition cursor-pointer" title="노란 캡슐">🟡</div>
                    <div class="text-4xl sm:text-5xl filter drop-shadow-lg transform -translate-y-1 hover:scale-110 transition cursor-pointer" title="강아지">🐶</div>
                    <div class="text-4xl sm:text-5xl filter drop-shadow-lg transform translate-y-1 hover:scale-110 transition cursor-pointer" title="파란 캡슐">🔵</div>
                </div>

                <!-- Floor Bar -->
                <div class="absolute bottom-0 left-0 right-0 h-3 bg-pink-300 border-t-2 border-pink-400"></div>
            </div>

        </div>

        <!-- ARCADE CONTROL PANEL (BOTTOM) -->
        <div class="mt-3 bg-gradient-to-r from-pink-400 via-rose-400 to-purple-400 p-3 rounded-2xl border-2 border-white flex items-center justify-between shadow-lg relative">
            
            <!-- Joystick Decor -->
            <div class="flex items-center gap-3 pl-2">
                <div class="relative w-10 h-10 bg-gray-700 rounded-full flex items-center justify-center border-2 border-gray-900 shadow-inner">
                    <div class="w-4 h-4 bg-red-500 rounded-full shadow-md transform -translate-y-2 -translate-x-1 border border-red-700"></div>
                    <div class="absolute w-1 h-5 bg-gray-400 rounded top-2 transform -rotate-12 -z-0"></div>
                </div>
                <div class="hidden sm:flex flex-col text-white font-jua text-xs leading-tight">
                    <span>스마트폰 대신</span>
                    <span class="text-yellow-200">행운 뽑기!</span>
                </div>
            </div>

            <!-- START DRAW BUTTON -->
            <button id="drawBtn" class="btn-arcade bg-gradient-to-r from-yellow-300 via-amber-400 to-yellow-500 hover:from-yellow-200 hover:to-amber-300 text-pink-950 font-jua text-xl sm:text-2xl px-6 sm:px-8 py-3 rounded-2xl border-2 border-white flex items-center gap-2 font-bold cursor-pointer">
                <span>🎯</span>
                <span>뽑기 시작하기</span>
            </button>
        </div>
    </main>

    <!-- FOOTER INFO -->
    <footer class="mt-3 text-center text-xs sm:text-sm font-semibold text-pink-900/80 bg-white/40 backdrop-blur-sm px-4 py-1.5 rounded-full">
        🌱 폰프리스쿨 Day: 스마트폰을 두고 친구들과 즐거운 추억을 만들어보세요!
    </footer>

    <!-- RESULT MODAL POPUP -->
    <div id="resultModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 hidden p-4">
        <div class="bg-gradient-to-b from-white to-pink-50 rounded-3xl p-6 sm:p-8 max-w-sm w-full text-center border-4 border-pink-400 shadow-2xl relative animate-pop">
            
            <!-- Header Ribbon -->
            <div class="absolute -top-6 left-1/2 -translate-x-1/2 bg-gradient-to-r from-pink-500 to-rose-500 text-white font-jua text-lg px-6 py-1.5 rounded-full shadow-lg border-2 border-white whitespace-nowrap">
                🎉 당첨을 축하합니다! 🎉
            </div>

            <!-- Prize Icon Container -->
            <div class="my-6 relative inline-block">
                <div class="w-28 h-28 sm:w-32 sm:h-32 bg-yellow-100 rounded-full flex items-center justify-center text-6xl sm:text-7xl shadow-inner border-4 border-yellow-300 mx-auto">
                    <span id="prizeIcon" class="transform hover:scale-110 transition">🎁</span>
                </div>
                <div class="absolute -bottom-2 -right-2 text-3xl">✨</div>
            </div>

            <!-- Prize Title & Description -->
            <h3 id="prizeName" class="font-jua text-2xl sm:text-3xl text-pink-600 mb-2">
                선물 이름
            </h3>
            <p id="prizeDesc" class="text-gray-600 text-sm sm:text-base font-bold mb-6 bg-pink-100/70 p-3 rounded-xl border border-pink-200">
                선물 설명이 들어갑니다.
            </p>

            <!-- Claim / Retry Buttons -->
            <div class="flex gap-2 justify-center">
                <button id="closeModalBtn" class="w-full bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white font-jua text-lg py-3 rounded-xl shadow-lg border border-pink-300 transition active:scale-95">
                    다시 뽑기 🔄
                </button>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // Prize List Pool
        const PRIZES = [
            { name: "귀여운 학용품 세트 ✏️", icon: "✏️", desc: "알록달록 연필과 귀여운 지우개가 들어있어요!" },
            { name: "폰프리스쿨 칭찬 쿠폰 🎫", icon: "🎫", desc: "스마트폰 없이 하루를 알차게 보낸 자랑스러운 표창 쿠폰!" },
            { name: "맛있는 간식 꾸러미 🍪", icon: "젤리", desc: "친구들과 함께 나누어 먹을 수 있는 달콤한 간식 젤리!" },
            { name: "캐릭터 스티커 팩 🎨", icon: "🎨", desc: "다이어리와 공책을 예쁘게 꾸밀 수 있는 인기 스티커!" },
            { name: "폭신폭신 캐릭터 인형 🧸", icon: "🧸", desc: "가방에 쏙 달고 다닐 수 있는 귀여운 미니 인형!" },
            { name: "컬러 보드게임 미니 🎲", icon: "🎲", desc: "쉬는 시간에 친구들과 즐겁게 놀 수 있는 미니 보드게임!" },
            { name: "스페셜 럭키 스낵 🍫", icon: "🍫", desc: "달콤함이 2배! 학생자치회가 준비한 특별 초콜릿!" }
        ];

        // DOM Elements
        const drawBtn = document.getElementById('drawBtn');
        const craneCarriage = document.getElementById('craneCarriage');
        const craneCable = document.getElementById('craneCable');
        const craneHead = document.getElementById('craneHead');
        const clawAssembly = document.getElementById('clawAssembly');
        const grabbedItem = document.getElementById('grabbedItem');
        const resultModal = document.getElementById('resultModal');
        const prizeIcon = document.getElementById('prizeIcon');
        const prizeName = document.getElementById('prizeName');
        const prizeDesc = document.getElementById('prizeDesc');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const soundToggle = document.getElementById('soundToggle');
        const soundIcon = document.getElementById('soundIcon');
        const soundText = document.getElementById('soundText');

        let isSoundOn = true;
        let isPlaying = false;
        let synth, polySynth;

        // Sound Effects setup using Tone.js
        function initAudio() {
            if (!synth) {
                synth = new Tone.Synth().toDestination();
                polySynth = new Tone.PolySynth().toDestination();
                Tone.Master.volume.value = -6;
            }
        }

        function playSound(type) {
            if (!isSoundOn) return;
            try {
                initAudio();
                Tone.start();

                if (type === 'move') {
                    synth.triggerAttackRelease("C4", "8n");
                } else if (type === 'drop') {
                    synth.triggerAttackRelease("G3", "4n");
                } else if (type === 'grab') {
                    synth.triggerAttackRelease("E4", "8n");
                } else if (type === 'win') {
                    const now = Tone.now();
                    polySynth.triggerAttackRelease(["C4", "E4", "G4", "C5"], "8n", now);
                    polySynth.triggerAttackRelease(["G4", "B4", "D5", "G5"], "4n", now + 0.2);
                }
            } catch (e) {
                console.log("Audio play error", e);
            }
        }

        // Toggle Sound
        soundToggle.addEventListener('click', () => {
            isSoundOn = !isSoundOn;
            soundIcon.textContent = isSoundOn ? "🔊" : "🔇";
            soundText.textContent = isSoundOn ? "소리 ON" : "소리 OFF";
        });

        // Trigger Confetti
        function launchConfetti() {
            confetti({
                particleCount: 80,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#ff7b9c', '#ffc107', '#4ade80', '#60a5fa', '#a855f7']
            });
        }

        // Claw Machine Animation Sequence
        function startClawSequence() {
            if (isPlaying) return;
            isPlaying = true;
            drawBtn.disabled = true;

            // Random target position (Percentage across track)
            const targetX = Math.floor(Math.random() * 60) + 20; // 20% to 80%
            
            // Step 1: Move Crane Horizontally to target
            playSound('move');
            craneCarriage.style.left = `${targetX}%`;

            setTimeout(() => {
                // Step 2: Drop Crane Down
                playSound('drop');
                craneCable.style.height = "165px";

                setTimeout(() => {
                    // Step 3: Close Claw Arms & Grab Item
                    playSound('grab');
                    clawAssembly.classList.add('claw-grabbing');

                    // Pick random prize visual emoji for crane carry
                    const randomPrize = PRIZES[Math.floor(Math.random() * PRIZES.length)];
                    grabbedItem.innerHTML = `<span class="text-4xl filter drop-shadow-md">${randomPrize.icon === '젤리' ? '🍬' : randomPrize.icon}</span>`;
                    
                    setTimeout(() => {
                        // Show item attached to claw
                        grabbedItem.style.opacity = "1";
                        
                        // Step 4: Retract Crane Cable UP
                        craneCable.style.height = "35px";

                        setTimeout(() => {
                            // Step 5: Move Crane Left to Drop Chute
                            playSound('move');
                            craneCarriage.style.left = "15%";

                            setTimeout(() => {
                                // Step 6: Open Claw and Drop Item into Chute
                                clawAssembly.classList.remove('claw-grabbing');
                                grabbedItem.style.transform = "translate(-50%, 60px)";
                                grabbedItem.style.opacity = "0";

                                setTimeout(() => {
                                    // Reset grabbed item position styling
                                    grabbedItem.style.transform = "translate(-50%, 0)";
                                    
                                    // Step 7: Open Result Modal
                                    showResultModal(randomPrize);
                                }, 500);

                            }, 1000);

                        }, 1200);

                    }, 400);

                }, 1200);

            }, 800);
        }

        // Display Result Modal with details
        function showResultModal(prize) {
            playSound('win');
            launchConfetti();

            prizeIcon.textContent = prize.icon === '젤리' ? '🍬' : prize.icon;
            prizeName.textContent = prize.name;
            prizeDesc.textContent = prize.desc;

            resultModal.classList.remove('hidden');
        }

        // Event Listeners
        drawBtn.addEventListener('click', startClawSequence);

        closeModalBtn.addEventListener('click', () => {
            resultModal.classList.add('hidden');
            
            // Return Crane to Center Position for next turn
            craneCarriage.style.left = "50%";
            isPlaying = false;
            drawBtn.disabled = false;
        });

        // Interactive Click on Plushies directly to trigger draw
        document.querySelectorAll('#playArea .cursor-pointer').forEach(item => {
            item.addEventListener('click', () => {
                if (!isPlaying) startClawSequence();
            });
        });
    </script>
</body>
</html>
