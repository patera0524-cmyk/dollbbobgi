<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학교 퀴즈 인형뽑기 이벤트</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background: #0f051d;
            color: #fff;
            font-family: 'Pretendard', -apple-system, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .app-container {
            width: 100%;
            max-width: 800px;
            height: 100vh;
            max-height: 900px;
            background: #18092b;
            border-radius: 20px;
            border: 2px solid #ff2a85;
            box-shadow: 0 0 30px rgba(255, 42, 133, 0.4);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #120624;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .app-title { font-size: 1.3rem; font-weight: 800; color: #ff2a85; display: flex; align-items: center; gap: 8px; }
        .top-btns { display: flex; gap: 10px; }
        .icon-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .icon-btn:hover { background: rgba(255, 255, 255, 0.2); }

        .screen {
            position: absolute;
            top: 60px; left: 0; width: 100%; height: calc(100% - 60px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #18092b;
            z-index: 10;
            transition: opacity 0.3s;
        }
        .screen.hidden { opacity: 0; pointer-events: none; z-index: -1; }

        .main-title { font-size: 2.2rem; font-weight: 800; color: #00f5d4; margin-bottom: 15px; text-shadow: 0 0 15px rgba(0,245,212,0.5); }
        .main-sub { color: #b8c1ec; margin-bottom: 35px; font-size: 1.1rem; }
        .start-btn {
            background: linear-gradient(135deg, #ff2a85, #7209b7);
            color: #fff; border: none; padding: 16px 45px;
            font-size: 1.3rem; font-weight: 700; border-radius: 40px;
            cursor: pointer; box-shadow: 0 8px 20px rgba(255, 42, 133, 0.4);
            transition: transform 0.2s;
        }
        .start-btn:active { transform: scale(0.95); }

        .game-status {
            width: 100%; padding: 10px 20px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.3); font-weight: 700;
        }
        .coin-txt { color: #ffd700; display: flex; align-items: center; gap: 6px; }

        .canvas-area { flex: 1; width: 100%; position: relative; }
        canvas { width: 100%; height: 100%; display: block; }

        .control-area { padding: 15px; background: #120624; display: flex; justify-content: center; }
        .action-btn {
            width: 100%; max-width: 300px; padding: 16px;
            background: linear-gradient(135deg, #00f5d4, #4361ee);
            color: #0f051d; font-size: 1.2rem; font-weight: 800;
            border: none; border-radius: 14px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,245,212,0.4);
        }
        .action-btn:disabled { background: #3a3a4f; color: #666; box-shadow: none; cursor: not-allowed; }

        /* Modal */
        .modal {
            position: absolute; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.8); display: flex;
            justify-content: center; align-items: center; z-index: 100;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .modal.active { opacity: 1; pointer-events: auto; }
        .modal-box {
            background: #23113d; border: 2px solid #ff2a85;
            padding: 30px; border-radius: 20px; text-align: center;
            width: 85%; max-width: 400px;
        }
        .modal-title { font-size: 1.6rem; color: #ff2a85; font-weight: 800; margin-bottom: 15px; }
        .modal-text { font-size: 1.2rem; margin-bottom: 25px; line-height: 1.4; }
        .modal-btn {
            background: #ff2a85; color: #fff; border: none;
            padding: 10px 25px; border-radius: 10px; font-weight: 700; cursor: pointer;
        }

        /* Settings Modal */
        .settings-box {
            background: #1c0e33; border: 1px solid rgba(255,255,255,0.2);
            padding: 20px; border-radius: 16px; width: 90%; max-width: 500px; max-height: 80vh; display: flex; flex-direction: column;
        }
        .settings-list { flex: 1; overflow-y: auto; margin: 15px 0; display: flex; flex-direction: column; gap: 10px; }
        .item-row { display: flex; gap: 8px; align-items: center; }
        .item-row input { background: rgba(0,0,0,0.4); border: 1px solid #555; color: #fff; padding: 8px; border-radius: 6px; }
        .item-row input[type="text"] { flex: 2; }
        .item-row input[type="number"] { flex: 1; }
        .del-btn { background: #e63946; color: #fff; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="top-bar">
        <div class="app-title">🎓 학교 퀴즈 인형뽑기</div>
        <div class="top-btns">
            <button class="icon-btn" onclick="openSettings()">⚙️ 관리자</button>
        </div>
    </div>

    <!-- 메인 화면 -->
    <div id="mainScreen" class="screen">
        <div class="main-title">정답자 선물 뽑기!</div>
        <div class="main-sub">시작하기 버튼을 눌러 동전을 받아보세요</div>
        <button class="start-btn" onclick="startGame()">시작하기</button>
    </div>

    <!-- 게임 플레이 화면 -->
    <div id="gameScreen" class="screen hidden" style="padding:0;">
        <div class="game-status">
            <div class="coin-txt">🪙 보유 동전: <span id="coinCnt">0</span>개</div>
            <div style="color: #00f5d4;" id="statusTxt">대기 중</div>
        </div>
        <div class="canvas-area">
            <canvas id="clawCanvas" width="600" height="450"></canvas>
        </div>
        <div class="control-area">
            <button id="drawBtn" class="action-btn" onclick="startClaw()" disabled>동전 넣고 뽑기!</button>
        </div>
    </div>

    <!-- 결과 모달 -->
    <div id="resultModal" class="modal">
        <div class="modal-box">
            <div class="modal-title">🎉 당첨 축하합니다!</div>
            <div id="prizeTxt" class="modal-text">상품명</div>
            <button class="modal-btn" onclick="resetToMain()">확인 (다음 학생)</button>
        </div>
    </div>

    <!-- 관리자 설정 모달 -->
    <div id="settingsModal" class="modal">
        <div class="settings-box">
            <h3>🎁 상품 및 수량 설정</h3>
            <div id="prizeContainer" class="settings-list"></div>
            <div style="display:flex; gap:10px;">
                <button class="modal-btn" style="background:#4361ee; flex:1;" onclick="addPrizeRow()">상품 추가</button>
                <button class="modal-btn" style="background:#2ec4b6; flex:1;" onclick="saveSettings()">저장하기</button>
                <button class="modal-btn" style="background:#666; flex:0.5;" onclick="closeSettings()">닫기</button>
            </div>
        </div>
    </div>
</div>

<script>
    let prizes = JSON.parse(localStorage.getItem('quiz_prizes')) || [
        { name: "문화상품권 5천원", count: 5 },
        { name: "스낵 과자 세트", count: 10 },
        { name: "음료수 쿠폰", count: 15 },
        { name: "캐릭터 키링", count: 10 },
        { name: "꽝 (달콤한 사탕)", count: 20 }
    ];

    let coin = 0;
    let state = 'IDLE';
    const canvas = document.getElementById('clawCanvas');
    const ctx = canvas.getContext('2d');

    let claw = { x: 300, y: 60, targetX: 300, targetY: 60 };
    let toys = [];
    let caughtToy = null;

    function initToys() {
        toys = [];
        const colors = ['#ff2a85', '#00f5d4', '#ffd700', '#9d4edd', '#4361ee'];
        for (let i = 0; i < 15; i++) {
            toys.push({
                x: 80 + (i % 5) * 110 + Math.random() * 15,
                y: 340 + Math.floor(i / 5) * 30 + Math.random() * 10,
                color: colors[i % colors.length],
                radius: 20,
                caught: false
            });
        }
    }

    function startGame() {
        document.getElementById('mainScreen').classList.add('hidden');
        document.getElementById('gameScreen').classList.remove('hidden');
        coin = 1;
        state = 'IDLE';
        initToys();
        updateUI();
    }

    function updateUI() {
        document.getElementById('coinCnt').innerText = coin;
        const btn = document.getElementById('drawBtn');
        const statusTxt = document.getElementById('statusTxt');

        if (coin > 0 && state === 'IDLE') {
            btn.disabled = false;
            btn.innerText = "뽑기 시작하기! (GO)";
            statusTxt.innerText = "준비 완료";
        } else {
            btn.disabled = true;
            btn.innerText = state === 'IDLE' ? "동전 없음" : "집게 이동 중...";
            statusTxt.innerText = state === 'IDLE' ? "동전 필요" : "작동 중";
        }
    }

    function startClaw() {
        if (coin <= 0 || state !== 'IDLE') return;
        coin--;
        state = 'MOVING';
        updateUI();

        claw.targetX = 100 + Math.random() * 400;
        claw.targetY = 60;
    }

    function update() {
        if (state === 'MOVING') {
            claw.x += (claw.targetX - claw.x) * 0.08;
            if (Math.abs(claw.targetX - claw.x) < 2) {
                state = 'DOWN';
                claw.targetY = 320;
            }
        } else if (state === 'DOWN') {
            claw.y += (claw.targetY - claw.y) * 0.08;
            if (Math.abs(claw.targetY - claw.y) < 2) {
                // 인형 잡기
                let target = toys.find(t => !t.caught && Math.hypot(t.x - claw.x, t.y - claw.y) < 45);
                if (target) {
                    target.caught = true;
                    caughtToy = target;
                }
                state = 'UP';
                claw.targetY = 60;
                claw.targetX = 70;
            }
        } else if (state === 'UP') {
            claw.x += (claw.targetX - claw.x) * 0.08;
            claw.y += (claw.targetY - claw.y) * 0.08;
            if (caughtToy) {
                caughtToy.x = claw.x;
                caughtToy.y = claw.y + 30;
            }
            if (Math.abs(claw.targetX - claw.x) < 2 && Math.abs(claw.targetY - claw.y) < 2) {
                state = 'DROP';
                setTimeout(() => {
                    caughtToy = null;
                    state = 'IDLE';
                    showResult();
                }, 400);
            }
        }

        draw();
        requestAnimationFrame(update);
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 배경
        ctx.fillStyle = '#18092b';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 바닥
        ctx.fillStyle = '#281347';
        ctx.fillRect(0, 380, canvas.width, 70);

        // 인형들
        toys.forEach(t => {
            if (!t.caught) {
                ctx.fillStyle = t.color;
                ctx.beginPath();
                ctx.arc(t.x, t.y, t.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        });

        if (caughtToy) {
            ctx.fillStyle = caughtToy.color;
            ctx.beginPath();
            ctx.arc(caughtToy.x, caughtToy.y, caughtToy.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        // 로프
        ctx.strokeStyle = '#aaa';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(claw.x, 0);
        ctx.lineTo(claw.x, claw.y);
        ctx.stroke();

        // 집게 헤드
        ctx.fillStyle = '#ff2a85';
        ctx.fillRect(claw.x - 12, claw.y - 8, 24, 16);
        ctx.strokeStyle = '#00f5d4';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(claw.x - 12, claw.y + 8);
        ctx.lineTo(claw.x - 20, claw.y + 22);
        ctx.moveTo(claw.x + 12, claw.y + 8);
        ctx.lineTo(claw.x + 20, claw.y + 22);
        ctx.stroke();
    }

    function showResult() {
        let pool = [];
        prizes.forEach((p, i) => {
            for (let c = 0; c < p.count; c++) pool.push(i);
        });

        let prizeName = "모든 상품 소진!";
        if (pool.length > 0) {
            let winIdx = pool[Math.floor(Math.random() * pool.length)];
            prizes[winIdx].count--;
            localStorage.setItem('quiz_prizes', JSON.stringify(prizes));
            prizeName = prizes[winIdx].name;
        }

        document.getElementById('prizeTxt').innerText = `🎁 ${prizeName}`;
        document.getElementById('resultModal').classList.add('active');
    }

    function resetToMain() {
        document.getElementById('resultModal').classList.remove('active');
        document.getElementById('gameScreen').classList.add('hidden');
        document.getElementById('mainScreen').classList.remove('hidden');
    }

    // 관리자
    function openSettings() {
        let pw = prompt("관리자 비밀번호를 입력하세요 (기본: 1234)");
        if (pw !== "1234") {
            if (pw !== null) alert("비밀번호가 틀렸습니다.");
            return;
        }
        renderSettings();
        document.getElementById('settingsModal').classList.add('active');
    }
    function closeSettings() {
        document.getElementById('settingsModal').classList.remove('active');
    }
    function renderSettings() {
        let box = document.getElementById('prizeContainer');
        box.innerHTML = '';
        prizes.forEach((p, i) => {
            box.innerHTML += `
                <div class="item-row">
                    <input type="text" class="p-name" value="${p.name}">
                    <input type="number" class="p-count" value="${p.count}" min="0">
                    <button class="del-btn" onclick="delPrize(${i})">삭제</button>
                </div>
            `;
        });
    }
    function addPrizeRow() {
        prizes.push({ name: "새 상품", count: 10 });
        renderSettings();
    }
    function delPrize(i) {
        prizes.splice(i, 1);
        renderSettings();
    }
    function saveSettings() {
        let names = document.querySelectorAll('.p-name');
        let counts = document.querySelectorAll('.p-count');
        prizes = [];
        names.forEach((n, i) => {
            prizes.push({ name: n.value, count: parseInt(counts[i].value) || 0 });
        });
        localStorage.setItem('quiz_prizes', JSON.stringify(prizes));
        alert("저장되었습니다.");
        closeSettings();
    }

    requestAnimationFrame(update);
</script>
</body>
</html>
